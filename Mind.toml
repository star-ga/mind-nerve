[package]
name = "mind-nerve"
version = "0.3.1"
authors = ["STARGA, Inc. <info@star.ga>"]
description = "CPU-first intent-classification preselector for agent runtimes"
license = "Apache-2.0"

# mind-nerve is a single static binary that sits in front of any agent
# host (Claude Code, codex, vibe, gemini, MCP servers) and returns top-K
# relevant routes per turn in ≤30 ms p95 on commodity 4-core x86 CPU.
#
# Phase 1 architecture (FROZEN 2026-05-13):
#   - Sliding-window encoder: 2 layers, hidden=256, window=256/stride=192
#   - INT8 weights × Q16.16 activations (per-channel quantization)
#   - K/V overlap cache across windows
#   - Fused QKV+O projection
#   - Mean pool → direct dot-product against route embedding table
#   - Deterministic top-K with SHA-256(route_id) ASC tie-break
#   - 212-byte tamper-evident attestation envelope
#   - 1024-token hard wire cap
#
# See spec/architecture.md for the authoritative design and
# spec/numerics.md for the per-op reduction-order contract.

[mind]
# STATUS (2026-08-19): the sources listed below (src/*.mind) are LIVE — the
# 13-file front-end port completed 2026-08-15 (all files compile, link, and
# execute under mindc 0.10.2 project mode, zero JIT/launcher fallback: real
# native-ELF `mind-nerve` binary + native MCP server). This manifest IS the
# buildable configuration for that native front end. The pre-port dialect
# these files were originally written against (never accepted by any
# shipping mindc) is preserved as a historical archive at src/dormant/ and
# tests/unit/dormant/ (see src/dormant/README.md) — that tree is NOT
# referenced by this manifest and does not affect the live build. The CI
# gate for this tree is tests/mindc_gate.sh (legs 3-15); the separate
# mind/ kernel surface (luts + kernels + exports) is gated the same way
# against mind/Mind.toml.
#
# Pins describe the toolchain this manifest builds against: mindc 0.10.2 is
# the first release whose project-mode resolver name-checks fn bodies
# (mind#23) and on which this tree compiles clean (tests/mindc_gate.sh).
mindc-min    = "0.10.2"
mindc-max    = "0.11.0"
spec-version = "1.0"

# IR contract — mind-nerve's stdin wire protocol is the mic@2 text frame
# (see cli/main.mind's WIRE PROTOCOL header and tests/bit_identity/README.md);
# results are consumed by mind-runtime via `libmind::ir::load`. The IR
# surface is stable per docs/ir-stability.md upstream.
ir-format     = "mic@2"
ir-consumer   = "mind-runtime >= 0.2.4"

[determinism]
# mind-nerve's load-bearing guarantee is bit-identical top-K outputs across
# runs and across architectures, scoped to what this OSS release actually
# ships and gates: x86_64 CPU (verified) and ARM64 CPU (the underlying MIND
# Q16.16 substrate is hardware-verified; mind-nerve's own encoder/route
# pipeline reproducing that reference on ARM64 is the task #57 gate, not
# yet closed — see ROADMAP.md and docs/benchmarks.md §1). CUDA/WebGPU/NPU
# are NOT in OSS scope: no GPU/NPU emitter exists in this repo or in
# ~/mind today, and per README.md's licensing split a GPU tier, if it ever
# ships, is reserved for a potential private/enterprise line — see the
# GPU-tier architecture constraint in ROADMAP.md (2026-08-17): any future
# GPU tier emits MIND-native kernels through our own emitter, never a
# CUDA/PTX lowering. Anything that breaks the x86_64 guarantee is a Phase 1
# ship-blocker.
fixed-point         = "Q16.16"
weight-quantization = "INT8 (per-output-channel, Q16.16 scales)"
reduction-order     = "Pinned by construction: every reduction is a sequential while-loop in the .mind source (no reassociation freedom)"
softmax-strategy    = "Lookup table, no polynomial approximation"
tie-break           = "SHA-256(route_id) ascending"
envelope-version    = "v2 (212 bytes packed)"

# Reduction order is pinned BY CONSTRUCTION, not by a compiler lint: every
# accumulation in the .mind sources is written as a sequential `while`-loop,
# so no backend has reassociation freedom to exploit. No shipped mindc
# implements the once-envisioned E_NERVE_001..005 lint codes; the determinism
# guarantee here is structural (source shape), not a compile-time check.

[build]
entry         = "cli/main.mind"
output        = "mind-nerve"
optimization  = "aggressive"

[targets.cpu]
backend = "cpu"
# Lowering target: AVX2 (x86) + NEON (ARM). The INT8×i32 saturating MAC
# primitive lowers to VPDPBUSD on x86 and SDOT on ARM. Cross-arch
# bit-identity is enforced by a final scalar saturation step.
#
# The two mind/luts modules are listed EXPLICITLY: src/q16_16.mind does
# `import mind.luts.exp_q16;` / `import mind.luts.sqrt_q16;`, and mindc
# 0.10.2 project mode resolves a user-module call ONLY if the module is in
# the declared sources list (an undeclared import is E2003 at the call site,
# which then cascades to `undefined reference to q16_*` at link because
# q16_16.mind drops to JIT fallback). The module path is the file path with
# `/`→`.`, so "mind/luts/exp_q16.mind" registers as `mind.luts.exp_q16`.
# These two luts are self-contained (no `__mind_nerve_*` C-shim calls; the
# only import is std.vec) — the wordpiece/tanh/softmax/recip luts are NOT
# needed on the pre-tokenized preselect path.
sources = [
    "cli/main.mind",
    "src/lib.mind",
    "src/runtime_ffi.mind",
    "src/clock.mind",
    "src/chain_log.mind",
    "src/tokenizer.mind",
    "src/loader.mind",
    "src/model.mind",
    "src/encoder_kernels.mind",
    "src/inference.mind",
    "src/mcp.mind",
    "src/evidence.mind",
    "src/sha256.mind",
    "src/top_k.mind",
    "src/q16_16.mind",
    "mind/luts/exp_q16.mind",
    "mind/luts/sqrt_q16.mind",
]
# Native C-ABI host-I/O shims. These DEFINE the eight `__mind_nerve_rt_*`
# symbols declared in src/runtime_ffi.mind's `extern "C"` block (registered
# in mindc's STD_SURFACE_INTRINSICS). Without them the native link fails with
# `undefined reference to __mind_nerve_rt_*` and mindc emits a launcher
# instead of a real ELF. Compiled + statically linked through mindc's
# deterministic clang invocation, mirroring mind/Mind.toml's native_sources.
native_sources = [
    "mind/runtime/nerve_rt_shims.c",
]

# DECLARED, NOT SHIPPED. This target expresses the Windows-native intent — SAME
# cpu-backend lowering + the SAME source list as [targets.cpu], so that when it
# lands the deterministic Q16.16 payload code is byte-for-byte identical across
# substrates (the wedge). It is NOT buildable today: mindc 0.10.2 has no PE/COFF
# object emitter (cross-target native codegen is landing incrementally in mindc,
# not this repo) and fails loud rather than silently falling back. No Windows PE
# binary exists anywhere for mind-nerve — Windows installs run the pure-Python
# fallback path (see README.md). Native Windows PE distribution, cross-built from
# Linux via a MinGW-w64 sysroot, is on the roadmap gated on that mindc feature.
[targets.windows]
backend = "cpu"
target = "x86_64-w64-windows-gnu"
sources = [
    "cli/main.mind",
    "src/lib.mind",
    "src/runtime_ffi.mind",
    "src/clock.mind",
    "src/chain_log.mind",
    "src/tokenizer.mind",
    "src/loader.mind",
    "src/model.mind",
    "src/encoder_kernels.mind",
    "src/inference.mind",
    "src/mcp.mind",
    "src/evidence.mind",
    "src/sha256.mind",
    "src/top_k.mind",
    "src/q16_16.mind",
    "mind/luts/exp_q16.mind",
    "mind/luts/sqrt_q16.mind",
]
native_sources = [
    "mind/runtime/nerve_rt_shims_win.c",
]

# RESERVED — NOT BUILT. No GPU target ships in the OSS release, and no GPU
# emitter exists in this repo or in ~/mind today (the MLIR GPU path asserts
# *fallback*, not identity). Per the GPU-tier architecture constraint in
# ROADMAP.md (2026-08-17): if a GPU tier is ever built it MUST emit MIND-native
# kernels through our own emitter, NOT a lowering to PTX/NVVM against the CUDA
# toolchain — a vendor lowering would make byte-identity a per-vendor result to
# verify and reintroduce the proprietary-toolchain dependency the
# LLVM-independence track exists to shed. `backend = "cuda"` below is a
# placeholder name for that future MIND-native GPU emitter; it is NOT a sanction
# to lower to the CUDA toolchain.
[targets.cuda]
backend = "cuda"
# Phase 1: throughput-mode batch ≥ 32 only; not budgeted for p95 latency.
sources = [
    "cli/main.mind",
    "src/lib.mind",
    "src/runtime_ffi.mind",
    "src/clock.mind",
    "src/chain_log.mind",
    "src/tokenizer.mind",
    "src/loader.mind",
    "src/model.mind",
    "src/encoder_kernels.mind",
    "src/inference.mind",
    "src/mcp.mind",
    "src/evidence.mind",
    "src/sha256.mind",
    "src/top_k.mind",
    "src/q16_16.mind",
]

[test]
# Unit tests live under tests/unit/. Bit-identity gate lives under
# tests/bit_identity/.
sources = [
    "tests/unit/test_q16_16.mind",
    "tests/unit/test_sha256.mind",
    "tests/unit/test_top_k.mind",
    "tests/unit/test_evidence.mind",
    "tests/unit/test_inference.mind",
    "tests/unit/test_encoder.mind",
    "tests/unit/test_tokenizer.mind",
]

[bit-identity]
# CI gate: same model_hash + same catalog_hash + same request_hash
# MUST produce the same result_hash on every backend. Zero divergence
# tolerated. cpu_x86 (verified) ↔ cpu_arm (task #57, not yet closed) is the
# only pair this OSS release builds and gates.
backends-phase1 = ["cpu_x86", "cpu_arm"]
backends-phase2 = ["webgpu", "npu"]
# `cuda` is NOT a phase-1/phase-2 OSS gate — it is a RESERVED name for a future
# MIND-native GPU backend (see [targets.cuda] above), not a CUDA/PTX lowering,
# not built or gated in this repo today, and reserved for a potential private/
# enterprise tier per README.md's licensing split. No GPU/CUDA determinism
# claim is made by this OSS release.
backends-reserved = ["cuda"]
