# Dependabot configuration for mind-nerve.
#
# - Python (`pip`) — watches pyproject.toml + requirements.lock. Groups
#   minor/patch updates together so a single PR rolls forward the lock.
# - GitHub Actions (`github-actions`) — watches workflow `uses:` pins.
#
# Schedule: weekly, Monday 06:00 UTC.

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    ignore:
      # mind-nerve is a LIBRARY with `>=` dependency floors. A MAJOR
      # version-requirement floor bump (e.g. torch->2.13, mcp 1->2, setuptools
      # 83->84) forces downstream upgrades and only reduces compatibility — a
      # `>=` resolver already installs the latest patched version, so it never
      # improves security. Suppress these; Dependabot SECURITY updates (a real
      # advisory affecting the declared range) and the grouped minor/patch rolls
      # below still open.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      python-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      python-security:
        applies-to: security-updates
        update-types:
          - "patch"
          - "minor"
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
